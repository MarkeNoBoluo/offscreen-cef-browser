<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>Download confirmation test</title>
<div id="main-page">
  <button onclick="downloadFile('alpha.txt', 'alpha')">下载 alpha.txt</button>
  <button onclick="downloadFile('beta.txt', 'beta')">下载 beta.txt</button>
  <button onclick="downloadBoth()">连续下载两个文件</button>
  <button onclick="openPopupDownload()">弹窗下载 alpha.txt</button>
</div>
<div id="popup-page" hidden>
  <button onclick="downloadFile('popup-alpha.txt', 'popup alpha')">下载 popup-alpha.txt</button>
</div>
<script>
  const isPopupPage = new URLSearchParams(location.search).has('popup');
  document.getElementById('main-page').hidden = isPopupPage;
  document.getElementById('popup-page').hidden = !isPopupPage;

  function downloadFile(name, text) {
    const url = URL.createObjectURL(new Blob([text], {type: 'text/plain'}));
    const link = document.createElement('a');
    link.href = url;
    link.download = name;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function downloadBoth() {
    downloadFile('alpha.txt', 'alpha');
    downloadFile('beta.txt', 'beta');
  }
  function openPopupDownload() {
    window.open('download_confirmation_test.html?popup=1', '_blank');
  }
</script>
</html>
